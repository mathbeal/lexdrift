# git-cliff — the changelog is generated from the history, not written by hand.
# A hand-written changelog drifts from what was actually done and nobody
# notices until a reader trusts it.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[semantic versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by `git-cliff` from the commit history. Do not edit it
by hand: edit the commits, or the configuration in `cliff.toml`.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Nothing is lost: an unconventional commit is grouped, not dropped.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat",            group = "Added" },
  { message = "^add",             group = "Added" },
  { message = "^fix",             group = "Fixed" },
  { message = "^perf",            group = "Performance" },
  { message = "^refactor",        group = "Changed" },
  { message = "^docs",            group = "Documentation" },
  { message = "^test",            group = "Tests" },
  { message = "^(build|ci|chore)", group = "Internal" },
  { message = "^revert",          group = "Reverted" },
  { message = "^release",         skip = true },
  # A merge commit records how a branch landed, not what changed. The commits
  # it brings in are already listed on their own.
  { message = "^Merge (pull request|branch|remote)", skip = true },
  { message = ".*",               group = "Changed" },
]
