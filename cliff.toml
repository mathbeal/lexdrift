# git-cliff — le CHANGELOG se génère depuis l'historique, il ne s'écrit pas.
# Le format suit Keep a Changelog et les versions suivent le semver, comme
# l'annonce l'en-tête du fichier produit.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[semantic versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by `git-cliff` from the commit history. Do not edit it
by hand: edit the commits, or the configuration in `cliff.toml`.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Rien ne se perd : un commit non conventionnel est classé, pas écarté.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat",            group = "Added" },
  { message = "^add",             group = "Added" },
  { message = "^fix",             group = "Fixed" },
  { message = "^perf",            group = "Performance" },
  { message = "^refactor",        group = "Changed" },
  { message = "^docs",            group = "Documentation" },
  { message = "^test",            group = "Tests" },
  { message = "^(build|ci|chore)", group = "Internal" },
  { message = "^revert",          group = "Reverted" },
  { message = "^release",         skip = true },
  { message = ".*",               group = "Changed" },
]

commit_preprocessors = [
  # retire le préfixe conventionnel : la phrase se suffit à elle-même
  { pattern = '^(feat|fix|docs|perf|refactor|test|build|ci|chore)(\([^)]*\))?!?: *', replace = "" },
]
