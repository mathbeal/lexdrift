name: lexicon

on: [push, pull_request]

env:
  UV_FROZEN: "1"

jobs:
  sarif:
    name: lexdrift → Security tab
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv run lexdrift check lexdrift --format sarif > lexdrift.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: lexdrift.sarif
