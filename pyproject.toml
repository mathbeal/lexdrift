[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lexdrift"
dynamic = ["version"]
description = "Read the lexicon of a Python repository: verbs, nouns, synonyms — setting aside the vocabulary imposed by third-party libraries."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathieu Beal" }]
keywords = ["linter", "lexicon", "naming", "ast", "glossary", "vocabulary"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Source = "https://github.com/mathbeal/lexdrift"
Issues = "https://github.com/mathbeal/lexdrift/issues"

# Kept for `pip install -e ".[dev]"`. It must stay identical to the
# dependency-group below, and a test enforces that.
[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.10"]

# uv installs this group by default, so `uv run pytest` needs no flag. Passing
# --all-extras on some commands and not others makes uv re-sync the
# environment between them, which uninstalls the project mid-run.
[dependency-groups]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
lexdrift = "lexdrift.cli:main"

[tool.setuptools]
packages = ["lexdrift"]

[tool.setuptools.dynamic]
version = { attr = "lexdrift.__version__" }

[tool.setuptools.package-data]
lexdrift = ["*.json"]

[tool.ruff]
target-version = "py39"
line-length = 90

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",    # conflicts with D211, we keep D211
  "D213",    # conflicts with D212, we keep D212
  "COM812",  # conflicts with the formatter
  "ISC001",  # conflicts with the formatter
  "CPY001",  # no copyright header: the licence lives in LICENSE
  # os.walk has no pathlib equivalent before Python 3.12, and we target 3.9.
  # Mixing pathlib and os.path would be worse than committing to os.path.
  "PTH110", "PTH118", "PTH119", "PTH120", "PTH122", "PTH123", "PTH206",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# a command-line program writes to standard output: that is the product,
# not a forgotten logger call. Diagnostics go through the logger instead.
"lexdrift/cli.py" = ["T201"]
# N802: tests are named after the rule they check (test_L001_...).
"tests/*" = [
  "S101", "D100", "D101", "D103", "PLR2004", "INP001", "ARG001", "N802",
  "RUF012", "PLC0415",
  # tests run git and python with fixed arguments and no external input.
  "S603", "S607",
]

[tool.mypy]
# mypy 2.x refuses to target anything below 3.10. The 3.9 floor is enforced
# elsewhere: ruff targets py39, and CI runs the suite on a real 3.9.
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["lexdrift"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lexdrift"]
branch = true
# four lines of glue for "python -m lexdrift"; the module is exercised by a
# subprocess test, which coverage cannot follow.
omit = ["lexdrift/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
